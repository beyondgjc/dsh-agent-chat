<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Agent 工作台</title>
  <link rel="stylesheet" href="/style.css" />
  <script>
    /* 主题初始化：localStorage 记忆 > 系统深浅色 > 默认素纸。在首帧绘制前设定，避免闪烁 */
    (function () {
      var t = null;
      try { t = localStorage.getItem("wb-theme"); } catch (e) {}
      if (t !== "paper" && t !== "signal") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "signal" : "paper";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body class="disc">
  <header>
    <button type="button" id="btn-aside" class="ghost layout-toggle icon-toggle" aria-expanded="true" title="折叠/展开讨论列表" aria-label="折叠/展开讨论列表">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/>
        <path d="M6.2 2.8v10.4"/>
      </svg>
    </button>
    <span class="brand-mark" aria-hidden="true">
      <span class="brand-char">议</span>
      <svg class="brand-orbit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.6" />
        <ellipse cx="12" cy="12" rx="9" ry="4.2" transform="rotate(-24 12 12)" />
        <circle cx="19.2" cy="8" r="1.4" fill="currentColor" stroke="none" />
      </svg>
    </span>
    <h1>Super Agent 工作台</h1>
    <span class="muted">仅本机回环 · 来源校验 · 首期单场讨论</span>
    <div class="page-switch" role="group" aria-label="面板切换">
      <button type="button" data-page="disc" aria-pressed="true">讨论</button>
      <button type="button" data-page="groups" aria-pressed="false">群聊</button>
    </div>
    <div class="theme-switch" role="group" aria-label="界面主题">
      <button type="button" id="theme-paper" aria-pressed="true">素纸</button>
      <button type="button" id="theme-signal" aria-pressed="false">信号台</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden style="margin: 8px 16px"></div>
  <main>
    <aside>
      <button id="btn-new">＋ 新建讨论</button>
      <div id="disc-list"></div>
      <div class="muted small" id="legend">
        保证边界：各应用能力不同（codex 可设 read-only；其他应用按实测能力如实展示）；
        隔离未验证；扫描不保证找全敏感样例。
      </div>
    </aside>
    <section id="main">
      <div id="empty" class="muted">
        <svg class="empty-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="24" cy="24" r="6.5" />
          <circle cx="24" cy="39" r="3.2" />
          <circle cx="9.7" cy="28.6" r="3.2" />
          <circle cx="15.2" cy="11.9" r="3.2" />
          <circle cx="32.8" cy="11.9" r="3.2" />
          <circle cx="38.3" cy="28.6" r="3.2" />
        </svg>
        <p>← 选择或新建一场讨论</p>
        <p class="small">1–5 位 AI 应用围坐圆桌：提案 → 环形互评 → 修订 → 复核 → 综合 → 决策</p>
      </div>
      <div id="view" hidden>
        <div id="head"></div>
        <div id="stagebar"></div>
        <div id="actions"></div>
        <div id="msg-area" hidden></div>
        <nav id="tabs"></nav>
        <div id="viewer"></div>
        <div id="decisions"></div>
      </div>
      <div id="confirm-panel" hidden></div>
      <div id="new-form" hidden>
        <h2>新建讨论</h2>
        <label>从模板开始（一键填好参与者/轮数/模式/角色，全部仍可改）
          <select id="nf-template">
            <option value="">不使用模板（自由配置）</option>
          </select>
        </label>
        <label>需求文本（原文不可变快照）
          <textarea id="nf-req" rows="6" placeholder="为当前项目设计……"></textarea>
        </label>
        <label>参与者（1–5 位；第一位默认兼任综合者）
          <div id="nf-participants"></div>
          <div id="nf-install-hint" hidden></div>
          <div class="participant-actions">
            <button type="button" id="nf-add-participant" class="ghost">＋ 添加参与者</button>
            <span class="muted small">1 位为自评模式；2–5 位环形互评；上限 5 位。</span>
          </div>
          <div id="nf-hint-warn" class="hint-warn small" hidden>允许同应用多实例（独立性会下降，可能触发账户限流）</div>
          <div id="nf-hint-config" class="hint-ok small">模型/思考强度在接入检查后的确认页配置。</div>
        </label>
        <label>计划轮数（自动连续执行的轮数，1–3；每轮 = 互评 + 修订 + 复核）
          <select id="nf-rounds">
            <option value="1" selected>1 轮（默认）</option>
            <option value="2">2 轮</option>
            <option value="3">3 轮</option>
          </select>
        </label>
        <div class="muted small">计划跑完后，每个轮次边界都会停下来问你：根据讨论现状加一轮（总上限 3）或直接综合。</div>
        <label>项目目录（cwd）
          <div class="cwd-row">
            <input id="nf-cwd" type="text" readonly placeholder="必填：点「选择目录…」选定项目目录" />
            <button type="button" id="nf-pick">选择目录…</button>
          </div>
        </label>
        <div id="nf-warn" class="banner" hidden></div>
        <label class="check" id="nf-allow" hidden>
          <input type="checkbox" id="nf-allow-box" /> 我确认发送以上敏感内容
        </label>
        <button id="nf-create">创建并接入检查（免费）</button>
        <button id="nf-cancel" class="ghost">取消</button>
      </div>
    </section>
  </main>
  <div id="pk-overlay" hidden>
    <div id="pk-panel">
      <h3>选择项目目录</h3>
      <div id="pk-path" class="muted small">此电脑（选择盘符）</div>
      <div id="pk-list"><p class="muted">加载中……</p></div>
      <div class="pk-actions">
        <button id="pk-up" class="ghost">← 上一级</button>
        <span style="flex:1"></span>
        <button id="pk-ok" class="primary">选择此目录</button>
        <button id="pk-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
  <script>
    /* 主题开关：切换 html[data-theme] 并记忆；不触碰 app.js 的任何绑定 */
    (function () {
      var root = document.documentElement;
      var btnPaper = document.getElementById("theme-paper");
      var btnSignal = document.getElementById("theme-signal");
      function apply(t) {
        root.dataset.theme = t;
        btnPaper.setAttribute("aria-pressed", String(t === "paper"));
        btnSignal.setAttribute("aria-pressed", String(t === "signal"));
      }
      apply(root.dataset.theme === "signal" ? "signal" : "paper");
      btnPaper.addEventListener("click", function () {
        apply("paper");
        try { localStorage.setItem("wb-theme", "paper"); } catch (e) {}
      });
      btnSignal.addEventListener("click", function () {
        apply("signal");
        try { localStorage.setItem("wb-theme", "signal"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
